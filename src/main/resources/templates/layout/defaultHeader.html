<th:block th:fragment="header">
    
	<script th:src="@{/js/i18n.js}"></script>

    <header class="main-header">
        <nav class="navbar">
            <!-- Left side - Logo/Brand -->
            <div class="navbar-brand">
                <a th:href="@{/}" class="logo-link">
<!--                     <img th:src="@{/images/logo.png}" alt="App Logo" class="logo-img"> -->
                    <span class="app-name" id="title" data-i18n="app.title"></span>
                </a>
            </div>

            <!-- Right side - User controls -->
            <div class="navbar-actions">
            
                <!-- Language Toggle Button -->
				<div class="language-switcher">
				    <button id="langToggleBtn" class="language-toggle btn btn-toggle" onclick="toggleLanguage();">
				        <span class="language-text" id="languageText">मराठी</span>
				        <i id="toggleIcon" class="fas fa-toggle-off"></i>
				    </button>
				</div>

                
                <!-- User dropdown -->
                <div class="user-dropdown dropdown">
                    <button class="user-toggle" data-bs-toggle="dropdown" aria-expanded="false">
                        <div class="user-avatar">
                            <img th:src="@{/images/logo.png}" alt="User">
                        </div>
                        <span class="user-name" th:text="${session.user.firmName}"></span>
                        <i class="fas fa-chevron-down"></i>
                    </button>
                    <ul class="dropdown-menu dropdown-menu-end">
                    
                        <form th:action="@{/user/profile}" method="post">
                            <button type="submit" class="dropdown-item">
                                <i class="fas fa-user me-2"></i><span  data-i18n="app.header.profile">Profile</span>
                            </button>
                            <input type="hidden" th:name="email" th:value="${#authentication.principal.username}"/>
                            <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
                        </form>
                        <li><a class="dropdown-item" th:href="@{#}"><i class="fas fa-gear me-2"></i><span  data-i18n="app.header.setting">Setting</span></a></li>
<!--                         <li> -->
<!--                             <a class="dropdown-item language-toggle" href="#"> -->
<!--                                 <i class="fas fa-language me-2"></i> -->
<!--                                 <span class="language-text">Marathi</span> -->
<!--                                 <i class="fas fa-toggle-off ms-2"></i> -->
<!--                             </a> -->
<!--                         </li>                         -->
                        <li><hr class="dropdown-divider"></li>
                        <li>
                            <form th:action="@{/logout}" method="post">
                                <button type="submit" class="dropdown-item">
                                    <i class="fas fa-sign-out-alt me-2"></i><span  data-i18n="app.header.logout">Logout</span>
                                </button>
                                <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
                            </form>
                        </li>
                    </ul>
                </div>
            </div>
        </nav>
    </header>   
    
</th:block>
