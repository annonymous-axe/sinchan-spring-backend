    <script>
        $(document).ready(function(){
            let btnAction = null;
            let errorString = null;
            
            $('.select2').select2({width: '100%', allowClear: true, dropdownAutoWidth: true});

            $('.btn').click(function(){
                btnAction = $(this).val();
            });

			$("form").submit(function(){
				
				if(errorString!=null && errorString != ""){
					window.alert(errorString);
					errorString = "";
					return false;
				}else{
					alert("Submitting...");
					submitPage(btnAction);
					return true;
				}
				
			});
            
        });

        function isNumberKey(txt, evt) {
            
            var charCode = (evt.which) ? evt.which : evt.keyCode;
            if (charCode == 46) {
                //Check if the text already contains the . character
                if (txt.value.indexOf('.') === -1) {
                    return true;
                } else {
                    return false;
                }
            } else {
                if (charCode > 31
                    && (charCode < 48 || charCode > 57))
                    return false;
            }
            return true;
        }

		function submitPage(actionVal){
			
			document.getElementById("btnAction").value = actionVal;
			
			if(actionVal=="create"){
				alert("Creating invoice");
				document.invoiceForm.action="/invoiceSave";
				document.invoiceForm.submit();
			} else if(actionVal=="update"){
				alert("Updating invoice");
				document.invoiceForm.action="/invoiceUpdate";
				document.invoiceForm.submit();
			} else if(actionVal=="delete"){
				alert("Deleting invoice");
				document.invoiceForm.action="/invoiceDelete";
				document.invoiceForm.submit();
			}
		}
		
		function ValidateEmail(email) {
		    var expr = /^([\w-\.]+)@((\[[0-9]{1,3}\.[0-9]{1,3}\.[0-9]{1,3}\.)|(([\w-]+\.)+))([a-zA-Z]{2,4}|[0-9]{1,3})(\]?)$/;
		    return expr.test(email);
		}

        function addDetailsRow(){
            const tableBody = document.getElementById("manufacturerDetailsBody");

            const rowCount = tableBody.rows.length;

            const row = document.createElement("tr");

            const invoiceCategoryOptions = document.getElementById("invoiceCategoryOptions").innerHTML;

            row.innerHTML = `
                <td>
                    <select name="invoiceItemList[${rowCount}].categoryId" id="invoiceItemList[${rowCount}].categoryId" class="form-control select2" data-control="select2" data-placeholder="Select an option" onchange="updateItemList(this);" >
                        <option value="-1">---Select Category---</option>
                        ${invoiceCategoryOptions}
                    </select>
                </td>                                    
                <td>
                    <select name="invoiceItemList[${rowCount}].itemId" id="invoiceItemList[${rowCount}].itemId" class="form-control select2" data-control="select2" data-placeholder="Select an option" onchange="updateAvlQuantity(this);">
                        <option value="-1">---Select Item---</option>
                    </select>
                </td>
                <td>
                    <input type="text" name="invoiceItemList[${rowCount}].avlQuantity" id="invoiceItemList[${rowCount}].avlQuantity" placeholder="0" class="form-control" readonly/>
                </td>
                <td>
	                <input type="text" name="invoiceItemList[${rowCount}].cmlNumber" id="invoiceItemList[${rowCount}].cmlNumber" placeholder="CML000" class="form-control" readonly/>
	            </td>
                <td>
                    <input type="text" name="invoiceItemList[${rowCount}].quantity" id="invoiceItemList[${rowCount}].quantity" placeholder="Quantity" class="form-control" onchange="calculateTotalAmount(this)"/>
                </td>
                <td>
                    <input type="text" name="invoiceItemList[${rowCount}].unit" id="invoiceItemList[${rowCount}].unit" placeholder="Unit" class="form-control"/>
                </td>
                <td>
                    <input type="text" name="invoiceItemList[${rowCount}].rate" id="invoiceItemList[${rowCount}].rate" placeholder="Rate" class="form-control" onchange="calculateTotalAmount(this)"/>
                </td>
                <td>
                    <input type="text" name="invoiceItemList[${rowCount}].total" id="invoiceItemList[${rowCount}].total" placeholder="Total" class="form-control"/>
                </td>
                <td>
                    <a onclick="removeDetails(this);"><i class="fa-solid fa-xmark fa-flip remove-icon"></i> </a>
                </td>
            `;

            tableBody.appendChild(row);
            reIndexTable(tableBody);

            $('.select2').select2({width: '100%', allowClear: true, dropdownAutoWidth: true});
        }

        function removeDetails(td){
            // if (event.target.classList.contains("removeRow")) {
                const row = td.closest("tr");
                row.remove();
                // reIndexTable();
            // }
        }

        // Reindex form fields after add/remove
        function reIndexTable(tableBody) {
            const rows = tableBody.querySelectorAll("tr");
            rows.forEach((row, index) => {
                const inputs = row.querySelectorAll("input");
                inputs.forEach(input => {
                    if (input.name.includes("purchaseOrderManufacturerDetailsList")) {
                        const field = input.name.split(".")[1]; // e.g., rate, manufacturerId
                        input.name = `purchaseOrderManufacturerDetailsList[${index}].${field}`;
                    }
                });
            });
        }

        function updateItemList(selectBox){
        	
            const index = selectBox.id.substring(selectBox.id.indexOf("[")+1, selectBox.id.indexOf("]"));

            var itemSelectBox = document.getElementById('invoiceItemList['+index+'].itemId');

            const selectedCategory = parseInt(selectBox.value);
            
            $.ajax({
                type: 'POST',
                data: {categoryId : selectedCategory},
                url: "/getItemsFromCategoryId",
                success: function(data){

                	itemSelectBox.innerHTML = '';
                    
                    var option = document.createElement('option');
                    option.value = "";
                    option.text = "---Select---";

                    itemSelectBox.appendChild(option);

                    for(var i = 0; i < data.length; i++){
                        var option = document.createElement('option');
                        option.value = data[i].intKey;
                        option.text = data[i].stringValue;

                        itemSelectBox.appendChild(option);
                    }
                }
            });
        }

        function updateAvlQuantity(item){

            var index = 0;

            if(item.id.includes('[')){
                index = item.id.substring(16, item.id.indexOf(".") - 1);
                console.log("index : "+index);
            }else{
                index = item.id.substring(15, item.id.indexOf(".") - 1);
                console.log("index : "+index);
            }

        	var manufacturerId = parseInt(document.getElementById("manufacturerId").value);
        	
        	const data = {'itemId': item.value, 'manufacturerId': manufacturerId};
            $.ajax({
                type: 'POST',
                data: data,
                url: "/getItemDetails",
                success: function(data){
                	
                	console.log(data);

                    if(item.id.includes('[')){
                        document.getElementById("invoiceItemList["+index+"].avlQuantity").value = data.floatKey;
                    }else{
                        document.getElementById("invoiceItemList"+index+".avlQuantity").value = data.floatKey;
                    }

                    if(item.id.includes('[')){
                        document.getElementById("invoiceItemList["+index+"].rate").value = data.floatKey2;
                    }else{
                        document.getElementById("invoiceItemList"+index+".rate").value = data.floatKey2;
                    }
                    
                    if(item.id.includes('[')){
                        document.getElementById("invoiceItemList["+index+"].cmlNumber").value = data.stringValue;
                    }else{
                        document.getElementById("invoiceItemList"+index+".cmlNumber").value = data.stringValue;
                    }

                    if(item.id.includes('[')){
                        document.getElementById("invoiceItemList["+index+"].unit").value = data.stringValue2;
                    }else{
                        document.getElementById("invoiceItemList"+index+".unit").value = data.stringValue2;
                    }

                }
            });
            
        }

        function sendMail(){

            const itemId = parseInt(document.getElementById("id").value);

        	const data = {'itemId': itemId};
            $.ajax({
                type: 'POST',
                data: data,
                url: "/send-email",
                success: function(data){

                    alert(data);

                }
            });

        }
        
		function updateTahsilList(district){
			var districtId = district.value;
			
			$.ajax({
				url : "/getTehsils",
				type : "POST",
				data : {districtId : districtId},
				success : function(data){
					
					var tehsilSelectBox = document.getElementById('tehsil');
					let previousValue = tehsilSelectBox.value;
					tehsilSelectBox.innerHTML = "";
					
					var option = document.createElement("option");
					option.value = "";
					option.text = "--- Select ---";
					tehsilSelectBox.appendChild(option);
					for(var i=0; i<data.length; i++){
					console.log(data[i]);
						var option = document.createElement("option");
						option.value = data[i].talukaId;
						option.text = data[i].talukaName;
						tehsilSelectBox.appendChild(option);
						
					}

					$(tehsilSelectBox).val(previousValue).change("trigger");
				}
			});
		}
		
		function calculateTotalAmount(element){
			
			var index = 0;

			var avlQuantity;
			var quantity;
			var totalAmount;
			var rate;
			
			if(element.id.includes("[")){
				index = element.id.substring(element.id.indexOf("[")+1, element.id.indexOf("]"));

				avlQuantity = document.getElementById("invoiceItemList["+index+"].avlQuantity");

				quantity = document.getElementById("invoiceItemList["+index+"].quantity");

				rate = document.getElementById("invoiceItemList["+index+"].rate");

				totalAmount = document.getElementById("invoiceItemList["+index+"].total");


			}else{
				index = element.id.substring(15, element.id.indexOf("."));

				avlQuantity = document.getElementById("invoiceItemList"+index+".avlQuantity");

				quantity = document.getElementById("invoiceItemList"+index+".quantity");

				rate = document.getElementById("invoiceItemList["+index+"].rate");

				totalAmount = document.getElementById("invoiceItemList"+index+".total");
			}

			console.log("quantity : "+quantity.value);
			console.log("avlQuantity : "+avlQuantity.value);

			if(parseFloat(quantity.value) >= parseFloat(avlQuantity.value)){
			    quantity.value = 0;
			    alert("Please enter quantity less that or equal to availables.");
			}

			
			totalAmount.value = parseFloat(quantity.value) * parseFloat(rate.value);
			
		}
