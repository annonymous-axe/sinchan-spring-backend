<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title data-i18n="app.title"></title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-EVSTQN3/azprG1Anm3QDgpJLIm9Nao0Yz1ztcQTwFspd3yD65VohhpuuCOmLASjC" crossorigin="anonymous">

    <!-- Styles -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/select2@4.1.0-rc.0/dist/css/select2.min.css" />
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/select2-bootstrap-5-theme@1.3.0/dist/select2-bootstrap-5-theme.min.css" />
    <!-- Or for RTL support -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/select2-bootstrap-5-theme@1.3.0/dist/select2-bootstrap-5-theme.rtl.min.css" />
    
    <script src="https://kit.fontawesome.com/2fd82847eb.js" crossorigin="anonymous"></script>
    
   	<!-- Google Fonts: Poppins -->
	<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600&display=swap" rel="stylesheet">    

    <script src="https://cdn.jsdelivr.net/npm/select2@4.1.0-rc.0/dist/js/select2.min.js"></script>
    <link rel="stylesheet" th:href="@{/css/custome-css.css}">
    <link rel="stylesheet" th:href="@{/css/custome-select2-design.css}">
    
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/bootstrap-datepicker/1.9.0/css/bootstrap-datepicker.min.css"> 

    <style>
        #addButton:hover{
            cursor: pointer;
        }
    </style>
</head>
<body>

    <div class="layout">
        <div class="item" th:insert="~{layout/defaultHeader :: header}"></div>
        <div class="item" th:insert="~{layout/defaultMenu :: sideBar}"></div>
        <div class="item">

            <div class="container-fluid" style="overflow: auto;">

                <form id="purchaseOrderForm" name="purchaseOrderForm" method="post" th:object="${purchaseOrder}">

                    <div class="content">

                        <div class="row">
                            <div class="col-12">
                                <div class="page-title-box">
                                    <div class="page-title-right">
                                        <h5 class="title"><b data-i18n="app.purchase.purchase.title"></b></h5>
                                        <p  data-i18n="app.purchase.purchase.purchaseId"><span th:text="${purchaseOrderID}" ></span></p>
                                    </div>
                                </div>
                            </div>
                        </div>

                        <div class="card default-card shadow p-3 mb-5 bg-white rounded" style="width: 100%;">
                            <div class="card-body">

                                <div class="row">
                                    <div class="col-4">
                                        <label for="poNumber" data-i18n="app.purchase.purchase.purchase-order-no">Purchase Order No</label>
                                        <br/>
                                        <input type="hidden" id="id" th:field="*{id}">
                                        <input type="text" id="poNumber" th:field="*{poNumber}" class="form-control"  placeholder="Purchase Order Number" autocomplete="off" required>
                                    </div>

                                    <div class="col-4">
                                        <label for="supplierName" data-i18n="app.purchase.purchase.supplier-name">Supplier Name</label>
                                        <br/>
                                        <input type="hidden" id="id" th:field="*{id}">
                                        <input type="text" id="supplierName" th:field="*{supplierName}" class="form-control"  placeholder="Supplier Name" autocomplete="off" required>
                                    </div>                            
                                    <div class="col-4">
                                        <label for="purchaseDate" data-i18n="app.purchase.purchase.purchase-date">Purchase Date</label> 
                                        <input type="text" id="purchaseDate" th:field="*{purchaseDate}" th:value="${#dates.format(purchaseOrder.purchaseDate, 'dd/MM/yyyy')}" class="form-control" placeholder="Select Date" autocomplete="off"/>
                                    </div>
                                </div>
                                <br/>
                                <div class="row">
                                    <div class="col-4">
                                        <label for="billNumber" data-i18n="app.purchase.purchase.bill-number">Bill Number</label>
                                        <br/>
                                        <input type="text" id="billNumber" th:field="*{billNumber}" class="form-control"  placeholder="Bill Number" autocomplete="off" required>
                                    </div>
                                </div>

                                <select id="purchaseOrderCategoryOptions" style="display: none;" >
                                    <option value="">Select Category</option>
                                    <option th:each="dict : ${categoryLblValList}" th:value="${dict.intKey}" th:text="${dict.stringValue}"></option>
                                </select>
                                
                                <select id="purchaseOrderManufacturerOptions" style="display: none;">
                                    <option value="">Select Manufacturer</option>
                                    <option th:each="dict : ${manufacturerLblValList}" th:value="${dict.intKey}" th:text="${dict.stringValue}"></option>
                                </select>                         

                            </div>
                        </div>

                        <br>
                        <br>

                        <div class="row">
                            <div class="col-12">
                                <div class="page-title-box">
                                    <div class="page-title-right">
                                        <b data-i18n="app.purchase.purhase.table-title.purchase-detail"></b>&nbsp;&nbsp;
                                        <a onclick="addDetailsRow();" id="addButton"><span><i class="fa-solid fa-plus"></i></span></a>
                                    </div>
                                </div>
                            </div>
                        </div>
                        <br>

                        <div class="card default-card shadow p-3 mb-5 bg-white rounded" style="width: 100%;">
                            <div class="card-body">

                                    <table class="table table-bordered">

                                        <thead>
                                            <tr>
                                                <th data-i18n="app.purchase.purchase.table-heading.category"></th>
                                                <th data-i18n="app.purchase.purchase.table-heading.item"></th>
                                                <th data-i18n="app.purchase.purchase.table-heading.manufacturer"></th>
                                                <th data-i18n="app.purchase.purchase.table-heading.quantity"></th>
                                                <th data-i18n="app.purchase.purchase.table-heading.rate"></th>
                                                <th data-i18n="app.purchase.purchase.table-heading.cml-number"></th>
                                                <th data-i18n="app.purchase.purchase.table-heading.total-amount"></th>
                                                <th data-i18n="app.purchase.purchase.table-heading.remove"></th>
                                            </tr>
                                        </thead>

                                        <tbody id="manufacturerDetailsBody">

                                            <tr th:each="detail, iterStat : *{purchaseOrderItemsList}">
                                                <td style="width: 10%">
                                                    <input type="hidden" th:field="*{purchaseOrderItemsList[__${iterStat.index}__].id}" class="form-control"/>
                                                    <select th:field="*{purchaseOrderItemsList[__${iterStat.index}__].categoryId}" id="purchaseOrderItemsList[__${iterStat.index}__].categoryId" class="form-control select2" data-control="select2" data-placeholder="Select an option" onchange="updateItemList(this);">
                                                        <option value="-1">---Select Category---</option>
                                                        <option th:each="dict : ${categoryLblValList}" th:value="${dict.intKey}" th:text="${dict.stringValue}"></option>
                                                    </select>
                                                </td>                                    
                                                <td style="width: 10%">
                                                    <select th:field="*{{purchaseOrderItemsList[__${iterStat.index}__].itemId}}" class="form-control select2" data-control="select2" data-placeholder="Select an option" >
                                                        <option value="-1">---Select Item---</option>
                                                        <option th:each="dict : ${detail.itemLblValList}" th:value="${dict.intKey}" th:text="${dict.stringValue}"></option>
                                                    </select>
                                                </td>
                                                <td style="width: 8%">
                                                    <select th:field="*{purchaseOrderItemsList[__${iterStat.index}__].manufacturerId}" class="form-control select2" data-control="select2" data-placeholder="Select an option">
                                                        <option value="-1">---Select Manufacturer---</option>
                                                        <option th:each="dict : ${manufacturerLblValList}" th:value="${dict.intKey}" th:text="${dict.stringValue}"></option>
                                                    </select>
                                                </td>
                                                <td style="width: 1%">
                                                    <input type="text" th:field="*{purchaseOrderItemsList[__${iterStat.index}__].quantity}" id="purchaseOrderItemsList[__${iterStat.index}__].quantity" placeholder="Quantity" class="form-control" onchange="calculcateTotalAmount('${iterStat.index}');" />
                                                </td>
                                                <td style="width: 3%">
                                                    <input type="text" th:field="*{purchaseOrderItemsList[__${iterStat.index}__].rate}" id="purchaseOrderItemsList[__${iterStat.index}__].rate" placeholder="Rate" class="form-control" onchange="calculcateTotalAmount('${iterStat.index}');" />
                                                </td>
                                                <td style="width: 4%">
                                                    <input type="text" th:field="*{purchaseOrderItemsList[__${iterStat.index}__].cmlNumber}" id="purchaseOrderItemsList[__${iterStat.index}__].racmlNumberte" placeholder="CML Number" class="form-control" />
                                                </td>
                                                <td style="width: 4%">
                                                    <input type="text" th:field="*{purchaseOrderItemsList[__${iterStat.index}__].totalAmount}" id="purchaseOrderItemsList[__${iterStat.index}__].totalAmount" readonly placeholder="Total Amount" class="form-control"/>
                                                </td>
                                                <td style="width: 0.1%">
                                                    <a onclick="removeDetails(this);"><i class="fa-solid fa-xmark remove-icon"></i> </a>
                                                </td>
                                            </tr>

                                            <tr th:if="*{purchaseOrderItemsList.size()} == 0">
                                                <td>
                                                    <input type="hidden" th:field="*{purchaseOrderItemsList[0].id}" class="form-control"/>
                                                    <select th:field="*{purchaseOrderItemsList[0].categoryId}" id="purchaseOrderItemsList[0].categoryId" onchange="updateItemList(this);" class="form-control select2" data-control="select2" data-placeholder="Select an option">
                                                        <option value="-1">---Select Category---</option>
                                                        <option th:each="dict : ${categoryLblValList}" th:value="${dict.intKey}" th:text="${dict.stringValue}"></option>
                                                    </select>
                                                </td>                                    
                                                <td>
                                                    <select th:field="*{purchaseOrderItemsList[0].itemId}" id="purchaseOrderItemsList[0].itemId" class="form-control select2" data-control="select2" data-placeholder="Select an option" >
                                                        <option value="-1">---Select Item---</option>
                                                    </select>
                                                </td>
                                                <td>
                                                    <select th:field="*{purchaseOrderItemsList[0].manufacturerId}" class="form-control select2" data-control="select2" data-placeholder="Select an option">
                                                        <option value="-1">---Select Manufacturer---</option>
                                                        <option th:each="dict : ${manufacturerLblValList}" th:value="${dict.intKey}" th:text="${dict.stringValue}"></option>
                                                    </select>
                                                </td>                                        
                                                <td>
                                                    <input type="text" th:field="*{purchaseOrderItemsList[0].quantity}" id="purchaseOrderItemsList[0].quantity" placeholder="Quantity" class="form-control" onchange="calculcateTotalAmount('0');"/>
                                                </td>
                                                <td>
                                                    <input type="text" th:field="*{purchaseOrderItemsList[0].rate}" id="purchaseOrderItemsList[0].rate" placeholder="Rate" class="form-control" onchange="calculcateTotalAmount('0');"/>
                                                </td>
                                                <td>
                                                    <input type="text" th:field="*{purchaseOrderItemsList[0].cmlNumber}" id="purchaseOrderItemsList[0].racmlNumberte" placeholder="CML Number" class="form-control" />
                                                </td>                                        
                                                <td>
                                                    <input type="text" th:field="*{purchaseOrderItemsList[0].totalAmount}" id="purchaseOrderItemsList[0].totalAmount" placeholder="Total Amount" readonly class="form-control"/>
                                                </td>
                                                <td>
                                                    <a onclick="removeDetails(this);"><i class="fa-solid fa-xmark remove-icon"></i> </a>
                                                </td>                                                
                                            </tr>

                                        </tbody>

                                    </table>

                            </div>
                        </div>

                        <br/>
                        <table style="width:100%">
                            <tr style="width: 100%; height: 25px; font-size: 12px;">
                                <td style="width:100%">
                                        <span th:if="${purchaseOrderID == null || purchaseOrderID == ''}">
                                            <button id="create" name="create" value="create" class="btn btn-outline-success rounded-pill"><i class="glyph-icon icon-check-circle-o"></i>Create</button>
                                        </span>
<!--                                         <span th:if="${purchaseOrderID != null  && purchaseOrderID != ''}"> -->
<!--                                             <button id="update" name="update" value="update" class="btn btn-outline-success rounded-pill"><i class="glyph-icon icon-check-circle-o"></i>Update</button> -->
<!--                                             &nbsp;&nbsp; -->
<!--                                             <button id="delete" name="delete" value="delete" class="btn btn-outline-danger rounded-pill"><i class="glyph-icon icon-check-circle-o"></i>Delete</button> -->
<!--                                         </span> -->
                                        &nbsp;&nbsp;
                                        <a class="btn btn-outline-info rounded-pill" th:href="@{/purchaseOrderView}" ><i class="glyph-icon icon-arrow-circle-o-left"></i>Back</a>
                                </td>
                            </tr>
                        </table>
						<br>
						<br>
                        <input type="hidden" id="btnAction" name="btnAction">
                        <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}" />

                    </div>

                </form>

            </div>
            
        </div>

    </div>
    
</body>

    <script>
        $(document).ready(function(){
            let btnAction = null;
            let errorString = null;

            $('.btn').click(function(){
                btnAction = $(this).val();
            });
            
            $('.select2').select2({width: '100%', allowClear: true, dropdownAutoWidth: true});

			$("form").submit(function(){
				
				if(errorString!=null && errorString != ""){
					window.alert(errorString);
					errorString = "";
					return false;
				}else{
					submitPage(btnAction);
					return true;
				}
				
			});
            
        });

        $(function () {
            $("#purchaseDate").datepicker({
                dateFormat: "mm/dd/yyyy",
                changeMonth: true,
                changeYear: true
            });
        });

        function isNumberKey(txt, evt) {
            
            var charCode = (evt.which) ? evt.which : evt.keyCode;
            if (charCode == 46) {
                //Check if the text already contains the . character
                if (txt.value.indexOf('.') === -1) {
                    return true;
                } else {
                    return false;
                }
            } else {
                if (charCode > 31
                    && (charCode < 48 || charCode > 57))
                    return false;
            }
            return true;
        }

		function submitPage(actionVal){
			
			document.getElementById("btnAction").value = actionVal;
			
			if(actionVal=="create"){
				document.purchaseOrderForm.action="/purchaseOrderSave";
				document.purchaseOrderForm.submit();
			} else if(actionVal=="approve"){
				document.purchaseOrderForm.action="/purchaseOrderApprove";
				document.purchaseOrderForm.submit();
			}else if(actionVal=="decline"){
				document.purchaseOrderForm.action="/purchaseOrderDecline";
				document.purchaseOrderForm.submit();
			} else if(actionVal=="update"){
				document.purchaseOrderForm.action="/purchaseOrderUpdate";
				document.purchaseOrderForm.submit();
			} else if(actionVal=="delete"){
				document.purchaseOrderForm.action="/purchaseOrderDelete";
				document.purchaseOrderForm.submit();
			}
		}
		
		function ValidateEmail(email) {
		    var expr = /^([\w-\.]+)@((\[[0-9]{1,3}\.[0-9]{1,3}\.[0-9]{1,3}\.)|(([\w-]+\.)+))([a-zA-Z]{2,4}|[0-9]{1,3})(\]?)$/;
		    return expr.test(email);
		}

        function addDetailsRow(){
            const tableBody = document.getElementById("manufacturerDetailsBody");

            const rowCount = tableBody.rows.length;

            const row = document.createElement("tr");

            const categoryListOptions = document.getElementById("purchaseOrderCategoryOptions").innerHTML;

            const manufacturerOptions = document.getElementById("purchaseOrderManufacturerOptions").innerHTML;

            row.innerHTML = `
                <td>
            		<input type="hidden" name="purchaseOrderManufacturerDetailsList[${rowCount}].id" class="form-control" />
	                <select name="purchaseOrderItemsList[${rowCount}].categoryId" id="purchaseOrderItemsList[${rowCount}].categoryId" onchange="updateItemList(this);" class="form-control select2" data-control="select2" data-placeholder="Select an option">
	                	${categoryListOptions}
	                </select>
	            </td>            
                <td>
	                <select name="purchaseOrderItemsList[${rowCount}].itemId" id="purchaseOrderItemsList[${rowCount}].itemId" class="form-control select2" data-control="select2" data-placeholder="Select an option" >
	                    
	                </select>
	            </td>
                <td>
	                <select name="purchaseOrderItemsList[${rowCount}].manufacturerId" class="form-control select2" data-control="select2" data-placeholder="Select an option">
	                    ${manufacturerOptions}
	                </select>
	            </td>
                <td>
                    <input type="text" name="purchaseOrderItemsList[${rowCount}].quantity" id="purchaseOrderItemsList[${rowCount}].quantity" placeholder="Quantity" class="form-control" onchange="calculcateTotalAmount('${rowCount}');"/>
                </td>	            
                <td>
                    <input type="text" name="purchaseOrderItemsList[${rowCount}].rate" id="purchaseOrderItemsList[${rowCount}].rate" placeholder="Rate" class="form-control" onchange="calculcateTotalAmount('${rowCount}');"/>
                </td>
                <td>
                    <input type="text" name="purchaseOrderItemsList[${rowCount}].cmlNumber" id="purchaseOrderItemsList[${rowCount}].cmlNumber" placeholder="CML Number" class="form-control" />
                </td>                
                <td>
                    <input type="text" name="purchaseOrderItemsList[${rowCount}].totalAmount" id="purchaseOrderItemsList[${rowCount}].totalAmount" placeholder="Total Amount" readonly class="form-control" />
                </td>
                <td>
                    <a onclick="removeDetails(this);"><i class="fa-solid fa-xmark remove-icon"></i> </a>
                </td>
            `;

            tableBody.appendChild(row);
            reIndexTable(tableBody);
            
            $('.select2').select2({width: '100%', allowClear: true, dropdownAutoWidth: true});
        }

        function removeDetails(td){
            // if (event.target.classList.contains("removeRow")) {
                const row = td.closest("tr");
                row.remove();
                // reIndexTable();
            // }
        }

        // Reindex form fields after add/remove
        function reIndexTable(tableBody) {
            const rows = tableBody.querySelectorAll("tr");
            rows.forEach((row, index) => {
                const inputs = row.querySelectorAll("input");
                inputs.forEach(input => {
                    if (input.name.includes("purchaseOrderManufacturerDetailsList")) {
                        const field = input.name.split(".")[1]; // e.g., rate, manufacturerId
                        input.name = `purchaseOrderManufacturerDetailsList[${index}].${field}`;
                    }
                });
            });
        }

        function calculcateTotalAmount(index){
            console.log(index);

            var quantity = document.getElementById("purchaseOrderItemsList["+index+"].quantity").value;
            var rate = document.getElementById("purchaseOrderItemsList["+index+"].rate").value;

            var totalAmount = (parseFloat(quantity) || 0) * (parseFloat(rate) || 0);

            
            document.getElementById("purchaseOrderItemsList["+index+"].totalAmount").value = totalAmount;
            
        }

        function updateItemList(selectBox){
        	
            const index = selectBox.id.substring(selectBox.id.indexOf("[")+1, selectBox.id.indexOf("]"));

            var itemSelectBox = document.getElementById('purchaseOrderItemsList['+index+'].itemId');

            const selectedCategory = parseInt(selectBox.value);
            
            $.ajax({
                type: 'POST',
                data: {categoryId : selectedCategory},
                url: "/getItemsFromCategoryId",
                success: function(data){

                	itemSelectBox.innerHTML = '';
                    
                    var option = document.createElement('option');
                    option.value = "";
                    option.text = "---Select---";

                    itemSelectBox.appendChild(option);

                    console.log(data);
                    for(var i = 0; i < data.length; i++){
                    	
                    	console.log(data[i]);
                        var option = document.createElement('option');
                        option.value = data[i].intKey;
                        option.text = data[i].stringValue;

                        itemSelectBox.appendChild(option);
                    }
                }
            });
        }

    </script>
</html>
