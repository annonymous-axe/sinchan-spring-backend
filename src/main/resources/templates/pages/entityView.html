<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title th:text="#{app.title}"></title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-EVSTQN3/azprG1Anm3QDgpJLIm9Nao0Yz1ztcQTwFspd3yD65VohhpuuCOmLASjC" crossorigin="anonymous">

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.1/css/font-awesome.min.css">
    
	<!-- DataTables CSS -->
	<link rel="stylesheet" href="https://cdn.datatables.net/1.13.6/css/jquery.dataTables.min.css">
	<link rel="stylesheet" href="https://cdn.datatables.net/1.13.6/css/dataTables.bootstrap5.min.css">
	<link rel="stylesheet" href="https://cdn.datatables.net/buttons/2.4.1/css/buttons.bootstrap5.min.css">
	
	<link rel="stylesheet" th:href="@{/css/default.css}">
</head>
<body>

    <div class="defaultHeader">
        <header th:insert="~{layout/defaultHeader :: header}"></header>
    </div>

    <div class="sideNavBar">
        <footer th:insert="~{layout/defaultMenu :: sideBar}"></footer>
    </div>

    <div class="content container-fluid">
    
        <div class="row">
			<div class="col-12">
				<div class="page-title-box">
					<div class="page-title-right">
                        <h5 class="title" th:text="#{app.master.entity.entityView.title}"></h5>
                    </div>
				</div>
			</div>
		</div>
    

        <form action="#" method="POST" id="employeeViewForm" name="employeeViewForm">

            <div class="card" style="width: 100%;">
                <div class="card-body">

                    <div class="row">

                        <div class="col-2">
<!--                            <a th:href="@{/createEmployee}" class="btn btn-outline-success" th:text="#{app.createBtn}"></a>-->
                        </div>

                    </div>
                    
                    <br>

					<div class="table-responsive">
						
						<table id = "basic-datatable" class="table table-centered w-100 dt-responsive">
						
							<thead class="table-light">
							
								<tr style="font-size: 14px;">

								    <th style="text-align: center;" th:text="#{app.master.entity.entityView.table-heading.entity-name}"></th>
								    <th style="text-align: center;" th:text="#{app.master.entity.entityView.table-heading.email}"></th>
<!--								    <th style="text-align: center;" th:text="#{app.master.entity.entityView.table-heading.contact-no}"></th>-->

								</tr>
							
							</thead>
							
							<tbody>
									
									<tr style="width:100%;height:25px; font-size: 11px;" th:each="entity : ${entityList}">

<!--										<td style="width:15%; cursor: pointer; text-align:center;" class="digienlistdetail"><span onClick="openemployeeDetails(this);" th:id="${employeeBean.empId}" th:text="${employeeBean.empId}"></span></td>-->
										<td style="width:15%; text-align:center;" class="digienlistdetail" th:text="${entity.fullName}"></td>
										<td style="width:15%; text-align:center;" class="digienlistdetail" th:text="${entity.email}"></td>
									
									</tr>
							
							</tbody>
							
						</table>
						
						<br/>
						<div style= "float : right; " id='tableActions'></div>    
						
					</div>


                </div>
            </div>
            
            <input type="hidden" id="formData" name="formData">

        </form>

    </div>
    
</body>

    <script>        
        $(document).ready(function () {
            $('#basic-datatable').DataTable({
                paging: true,
                searching: true,
                ordering: true,
                info: true,
                autoWidth: false,
                columnDefs: [
                    { orderable: false, targets: [1] }
                ],
                language: {
                    search: "",
                    lengthMenu: "Show _MENU_ entries",
                    info: "Showing _START_ to _END_ of _TOTAL_ entries"
                },
                dom: '<"top d-flex justify-content-between"l<"d-flex"f>>rt<"bottom"ip><"clear">', // Custom DOM
                responsive: true,                        // Make the table responsive
                lengthMenu: [5, 10, 25, 50],             // Dropdown for page size
            });
            
            var div = document.querySelector(".dataTables_length");
            div.querySelector("select").style.width = "50%";
            
            var div = document.querySelector(".dataTables_filter");
            div.querySelector("input").placeholder = "Search";
        });
       
        
        function openemployeeDetails(employee){
            document.getElementById("formData").value = employee.id;
        	document.employeeViewForm.action = "/getEmployee";
            document.employeeViewForm.method = "POST";
            document.employeeViewForm.submit();
        }
    </script>
</html>
