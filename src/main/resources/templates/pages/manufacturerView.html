<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title data-i18n="app.title"></title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-EVSTQN3/azprG1Anm3QDgpJLIm9Nao0Yz1ztcQTwFspd3yD65VohhpuuCOmLASjC" crossorigin="anonymous">

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.1/css/font-awesome.min.css">
    
	<!-- DataTables CSS -->
	<link rel="stylesheet" href="https://cdn.datatables.net/1.13.6/css/jquery.dataTables.min.css">
	<link rel="stylesheet" href="https://cdn.datatables.net/1.13.6/css/dataTables.bootstrap5.min.css">
	<link rel="stylesheet" href="https://cdn.datatables.net/buttons/2.4.1/css/buttons.bootstrap5.min.css">
	
    <script src="https://kit.fontawesome.com/2fd82847eb.js" crossorigin="anonymous"></script>
    
   	<!-- Google Fonts: Poppins -->
	<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600&display=swap" rel="stylesheet">    

	<link rel="stylesheet" th:href="@{/css/custome-css.css}">
</head>
<body>

    <div class="layout">
        <div class="item" th:insert="~{layout/defaultHeader :: header}"></div>
        <div class="item" th:insert="~{layout/defaultMenu :: sideBar}"></div>
        <div class="item">

            <div class="content container-fluid">
            
                <div class="row">
                    <div class="col-12">
                        <div class="page-title-box">
                            <div class="page-title-right">
                                <h5 class="title" data-i18n="app.master.manufacturer.manufacturerView.title"></h5>
                            </div>
                        </div>
                    </div>
                </div>
            

                <form action="#" method="POST" id="farmerViewForm" name="farmerViewForm">

                    <div class="card default-card shadow p-3 mb-5 bg-white rounded" style="width: 100%;">
                        <div class="card-body">

                            <div class="row">

                                <div class="col-2">
									<button type="button" id="create-btn" class="btn btn-outline-success" data-bs-toggle="modal" data-bs-target="#exampleModal" data-i18n="app.createBtn">
									</button>
                                </div>

                            </div>
                            
                            <br>

                            <div class="table-responsive">
                                
                                <table id = "basic-datatable" class="table table-centered w-100 dt-responsive">
                                
                                    <thead class="table-light">
                                    
                                        <tr style="font-size: 14px;">
                                            
                                            <th style="text-align: center;" data-i18n="app.master.manufacturer.manufacturerView.table-heading.manufacturer-id"></th>
                                            <th style="text-align: center;" data-i18n="app.master.manufacturer.manufacturerView.table-heading.manufacturer-name"></th>
                                            
                                        </tr>
                                    
                                    </thead>
                                    
                                    <tbody>
                                            
                                            <tr style="width:100%;height:25px; font-size: 11px;" th:each="manufacturer : ${manufacturerList}">
                                            
                                                <td style="width:15%; cursor: pointer; text-align:center;" class="digienlistdetail"><span onClick="openFarmerDetails(this);" th:id="${manufacturer.name}" th:text="${manufacturer.id}"></span></td>
                                                <td style="width:15%; text-align:center;" class="digienlistdetail" th:text="${manufacturer.name}"></td>
                                            
                                            </tr>
                                    
                                    </tbody>
                                    
                                </table>
                                
                                <br/>
                                <div style= "float : right; " id='tableActions'></div>    
                                
                            </div>

                        </div>
                    </div>
                    
                    <input type="hidden" id="duplicateEntry" th:value="${duplicateEntry}">
                    <input type="hidden" id="formData" name="formData">
                    <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}" />

                </form>

            </div>
            
			<!-- Modal -->
			<div class="modal fade" id="exampleModal" tabindex="-1" aria-labelledby="exampleModalLabel" aria-hidden="true">
			  <div class="modal-dialog">
			    <div class="modal-content">
			      <div class="modal-header">
			        <h5 class="modal-title" id="exampleModalLabel">Manufacturer Detail</h5>
			        <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
			      </div>
			      <div class="modal-body">
						<div class="container-fluid">
							<div class="row">
								<div class="col">Manufacturer Name</div>
								<div class="col">
									<input type="text" id="manufacturer_name" class="form-control" placeholder="manufacturer name"/>
								</div>
							</div>
						</div>
			      </div>
			      <div class="modal-footer">
			        <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Close</button>
			        <a type="button" id="saveBtn" onclick="udateManufacturer();" class="btn btn-outline-success">Save</a>
			      </div>
			    </div>
			  </div>
			</div>

        </div>
    </div>   
    
</body>

    <script>
        
        $(document).ready(function () {
        	
        	let modal = document.getElementById("create-btn");
        	modal.addEventListener('click', function () {
            	document.getElementById("manufacturer_name").value = "";
            	document.getElementById("saveBtn").innerText = "Save";
        	});
        	
            $('#basic-datatable').DataTable({
                paging: true,
                searching: true,
                ordering: true,
                info: true,
                autoWidth: false,
                columnDefs: [
                    { orderable: false, targets: [1] }
                ],
                language: {
                    search: "",
                    lengthMenu: "Show _MENU_ entries",
                    info: "Showing _START_ to _END_ of _TOTAL_ entries"
                },
                dom: '<"top d-flex justify-content-between"l<"d-flex"f>>rt<"bottom"ip><"clear">', // Custom DOM
                responsive: true,                        // Make the table responsive
                lengthMenu: [5, 10, 25, 50],             // Dropdown for page size
            });
            
            var div = document.querySelector(".dataTables_length");
            div.querySelector("select").style.width = "50%";
            
            var div = document.querySelector(".dataTables_filter");
            div.querySelector("input").placeholder = "Search";
            
        	
        	let exist = document.getElementById('duplicateEntry').value;
        	
        	if(exist != null && exist != ""){
        		alert(exist);
        	}
        });
       
        
        function udateManufacturer(){
        	let manufacturer_name = document.getElementById("manufacturer_name").value;
            document.getElementById("formData").value = manufacturer_name;
        	document.farmerViewForm.action = "/manufacturer/save";
            document.farmerViewForm.method = "POST";
            document.farmerViewForm.submit();
        }
        
        function deleteManufacturer(manufacturer){
            document.getElementById("formData").value = manufacturer;
        	document.farmerViewForm.action = "/manufacturer/delete";
            document.farmerViewForm.method = "POST";
            document.farmerViewForm.submit();
        }        
        
        function openFarmerDetails(manufacturer){
        	document.getElementById("manufacturer_name").value = manufacturer.id;
        	document.getElementById("saveBtn").innerText = "Delete";
        	document.getElementById("saveBtn").classList.remove("btn-outline-success");
        	document.getElementById("saveBtn").classList.add("btn-outline-danger");
        	document.getElementById("saveBtn").onclick = function(){
        		deleteManufacturer(manufacturer.id);
        	}
        	$("#exampleModal").modal("show");
        }
    </script>
</html>
